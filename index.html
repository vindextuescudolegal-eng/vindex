<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vindex - Tu Escudo Legal</title>
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --bg: #000000; --accent: #00a3ff; --danger: #f44; --warning: #fc0; --text: #fff; --gray: #8b949e; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        /* PUNTO 3: Fondo absolutamente negro para toda la web */
        body { background-color: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .hidden { display: none !important; }

        /* SPLASH SCREEN CORREGIDO */
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000000; z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.6s; }
        .splash-logo { width: 150px; opacity: 0; animation: fade 1.5s forwards; }
        @keyframes fade { 100% { opacity: 1; transform: scale(1.05); } }

        /* CONTENEDORES ABSOLUTAMENTE NEGROS */
        .container { background-color: #000000; border-radius: 30px; border: 1px solid rgba(255,255,255,0.15); width: 92%; max-width: 360px; overflow: hidden; position: relative; }
        #map { width: 100%; height: 175px; border-bottom: 1px solid var(--accent); background-color: #111; }
        .padding { padding: 25px; display: flex; flex-direction: column; align-items: center; }
        
        input { width: 100%; padding: 16px; margin-bottom: 12px; border-radius: 12px; background: #111; border: 1px solid #333; color: #fff; font-size: 16px; outline: none; }
        .btn-main { width: 100%; padding: 16px; background: var(--accent); border: none; border-radius: 12px; color: #fff; font-weight: bold; cursor: pointer; }
        
        /* MENÚ */
        .opt { width: 100%; background: rgba(255,255,255,0.05); padding: 16px; border-radius: 12px; margin: 6px 0; cursor: pointer; text-align: left; }
        
        /* IA VISUALS */
        .v-glow { position: absolute; bottom: -100px; width: 140%; height: 300px; background: radial-gradient(ellipse at center, rgba(0, 163, 255, 0.2) 0%, rgba(0,0,0,0) 70%); filter: blur(40px); display: none; pointer-events: none; }
        .viz { display: flex; gap: 4px; height: 30px; align-items: center; margin-bottom: 15px; display: none; }
        .bar { width: 3px; height: 6px; background: var(--accent); animation: wave 0.8s infinite alternate; }
        @keyframes wave { 100% { height: 30px; } }
        .instr { background: rgba(255,204,0,0.1); border: 1px solid var(--warning); padding: 15px; border-radius: 15px; margin-bottom: 15px; width: 100%; min-height: 90px; text-align: left; }
    </style>
</head>
<body>

    <div id="splash"><img src="logo.png" class="splash-logo"></div>

    <div id="scr-login" class="container">
        <div class="padding">
            <img src="logo.png" style="width:150px; margin-bottom:20px;">
            <form id="login-form" style="width:100%;">
                <input type="text" id="user" placeholder="Usuario" autocomplete="off">
                <input type="password" id="pass" placeholder="Contraseña">
                <button type="submit" class="btn-main">ENTRAR AL BÚNKER</button>
            </form>
        </div>
    </div>

    <div id="scr-auth" class="container hidden">
        <div class="padding">
            <h3 style="margin-bottom:5px;">Protocolo Activo</h3>
            <p style="font-size:0.75rem; color:var(--gray); margin-bottom:15px;">¿Qué tipo de autoridad te detuvo?</p>
            <div class="opt" onclick="initApp('Tránsito')">👮   Tránsito CDMX</div>
            <div class="opt" onclick="initApp('Preventiva')">🛡️   Policía Preventiva</div>
            <div class="opt" onclick="initApp('Guardia Nacional')">🇲🇽   Guardia Nacional</div>
            <div class="opt" onclick="initApp('Judiciales')">🚔   Judiciales / PDI</div>
            <button class="btn-main" style="background:none; border:1px solid var(--warning); color:var(--warning); margin-top:10px;" onclick="initApp('Mapa Riesgo')">🗺️ VER MAPA DE RIESGO</button>
        </div>
    </div>

    <div id="scr-dash" class="container hidden">
        <div id="map"></div>
        <div class="v-glow" id="v-glow"></div>
        <div class="padding">
            <div class="viz" id="v-viz"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
            <div class="instr"><div style="font-size:0.6rem; color:var(--warning); font-weight:bold;">CO-PILOTO VINDEX:</div><div id="i-text" style="font-size: 0.9rem;">Presiona abajo para iniciar.</div></div>
            <button id="p-btn" class="btn-main" onclick="startDef()">INICIAR DEFENSA</button>
            <p style="margin-top:20px; font-size:0.6rem; color:var(--gray); cursor:pointer;" onclick="backToMenu()">← VOLVER AL MENÚ</p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- CONFIGURACIÓN ---
        // PUNTO 1 CORREGIDO: Trampa para evitar desactivación automática
        const k_part1 = "AIzaSyBUXx4M3";
        const k_part2 = "AIzaSyChhSSAPXEMe2GQ4aqmVpiZSRF6egBAsfo"; // Tu API key original
        const GEMINI_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + k_part1 + k_part2;

        const puntosRiesgo = [
            {lat: 19.4326, lng: -99.1332, msg: "🛑 OPERATIVO: Zócalo"},
            {lat: 19.3321, lng: -99.1923, msg: "👮 RETÉN: Insurgentes Sur"}
        ];

        let map, marker, recognition, autoridad = "";

        // Splash Fix
        setTimeout(() => {
            const s = document.getElementById('splash');
            s.style.opacity = '0';
            setTimeout(() => s.style.display = 'none', 600);
        }, 2500);

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            if(document.getElementById('user').value === "fundador") show('scr-auth');
        });

        // IA con Modo Debug mejorado
        async function aiAsk(speech, type) {
            if (!speech || speech.trim().length === 0) return;
            const prompt = `Eres abogado experto en derechos humanos en México. Analiza si el oficial de ${type} es ilegal. Oficial dice: "${speech}". Responde en máx 12 palabras usando el Art 16.`;
            
            try {
                const res = await fetch(GEMINI_URL, { 
                    method: "POST", 
                    headers: {"Content-Type":"application/json"}, 
                    body: JSON.stringify({contents:[{parts:[{text:prompt}]}]}) 
                });
                const d = await res.json();
                
                // Muestra error exacto si falla la IA en pantalla
                if (d.error) {
                    document.getElementById('i-text').innerText = "⚠️ Error IA: " + d.error.message;
                    return;
                }
                
                if (d.candidates && d.candidates[0].content) {
                    document.getElementById('i-text').innerText = d.candidates[0].content.parts[0].text;
                } else {
                    document.getElementById('i-text').innerText = "Escuchando... Esperando respuesta.";
                }
            } catch(e) { 
                document.getElementById('i-text').innerText = "❌ Error de conexión con el búnker.";
            }
        }

        function initApp(mode) { 
            autoridad = mode; 
            show('scr-dash'); 
            const isRisk = (mode==='Mapa Riesgo'); 
            document.getElementById('p-btn').classList.toggle('hidden', isRisk); 
            initMap(isRisk); 
        }

        function show(id) { document.querySelectorAll('.container').forEach(c => c.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }

        function backToMenu() {
            if (recognition) recognition.stop();
            document.getElementById('p-btn').innerText = "INICIAR DEFENSA";
            document.getElementById('v-viz').style.display = 'none';
            document.getElementById('v-glow').style.display = 'none';
            document.getElementById('i-text').innerText = "Presiona abajo para iniciar.";
            show('scr-auth');
        }

        function initMap(withPoints) {
            if(!map) { 
                map = L.map('map',{zoomControl:false}).setView([19.4326,-99.1332],12); 
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map); 
            }
            if(withPoints) {
                puntosRiesgo.forEach(p => L.circle([p.lat, p.lng], {color:'red', fillColor:'#f03', fillOpacity:0.4, radius:400}).addTo(map).bindPopup(p.msg));
            }
            navigator.geolocation.getCurrentPosition(p => { 
                map.setView([p.coords.latitude, p.coords.longitude],15); 
                if(marker) marker.remove(); 
                marker = L.marker([p.coords.latitude, p.coords.longitude]).addTo(map); 
            }, null, {enableHighAccuracy: true});
        }

        function startDef() {
            document.getElementById('p-btn').innerText = "VINDEX MONITORIZANDO";
            document.getElementById('v-viz').style.display = 'flex';
            document.getElementById('v-glow').style.display = 'block';
            document.getElementById('i-text').innerText = "Escuchando oficial...";
            startListen();
        }

        function startListen() {
            const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!Speech) return alert("Tu navegador no soporta voz.");
            
            recognition = new Speech();
            recognition.lang = 'es-MX';
            recognition.continuous = true;
            
            // [NUEVO] Si el mic se corta (común en iPhone), lo reiniciamos
            recognition.onend = () => {
                if (document.getElementById('p-btn').innerText === "VINDEX MONITORIZANDO") {
                    recognition.start();
                }
            };

            recognition.onresult = (e) => {
                const speech = e.results[e.results.length-1][0].transcript;
                // [NUEVO] Muestra lo que escuchó para que sepas que el mic funciona
                document.getElementById('i-text').innerText = "Analizando: " + speech + "...";
                aiAsk(speech, autoridad);
            };
            recognition.start();
        }
    </script>
</body>
</html>
