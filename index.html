<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vindex - Tu Escudo Legal</title>
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --bg: #000000; --accent: #00a3ff; --warning: #fc0; --text: #ffffff; --gray: #8b949e; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        /* FONDO NEGRO ABSOLUTO (OLED) */
        body, html { background-color: #000000 !important; color: var(--text); font-family: -apple-system, sans-serif; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        /* BLOQUEO DE INTERFAZ AMONTONADA */
        .hidden { display: none !important; }

        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.6s; }
        .splash-logo { width: 180px; opacity: 0; animation: fade 1.5s forwards; }
        @keyframes fade { 100% { opacity: 1; transform: scale(1.05); } }

        .container { background-color: #000000; border-radius: 30px; border: 1px solid rgba(255,255,255,0.15); width: 92%; max-width: 360px; overflow: hidden; position: relative; }
        #map { width: 100%; height: 175px; border-bottom: 1px solid var(--accent); background: #000; }
        .padding { padding: 25px; display: flex; flex-direction: column; align-items: center; }
        
        input { width: 100%; padding: 16px; margin-bottom: 12px; border-radius: 12px; background: #111; border: 1px solid #333; color: #fff; font-size: 16px; outline: none; }
        .btn-main { width: 100%; padding: 16px; background: var(--accent); border: none; border-radius: 12px; color: #fff; font-weight: bold; cursor: pointer; }
        
        .opt { width: 100%; background: rgba(255,255,255,0.05); padding: 16px; border-radius: 12px; margin: 6px 0; cursor: pointer; text-align: left; transition: 0.2s; }
        .opt:active { background: rgba(0, 163, 255, 0.2); }

        /* ANIMACIÓN GEMINI */
        .viz { display: flex; gap: 4px; height: 30px; align-items: center; margin-bottom: 15px; display: none; }
        .bar { width: 3px; height: 6px; background: var(--accent); animation: wave 0.8s infinite alternate; }
        @keyframes wave { 100% { height: 30px; } }

        .instr { background: rgba(255, 204, 0, 0.05); border: 1px solid var(--warning); padding: 15px; border-radius: 15px; margin-bottom: 15px; width: 100%; min-height: 95px; text-align: left; }
        .app-logo { width: 140px; height: auto; margin-bottom: 20px; object-fit: contain; }
    </style>
</head>
<body>

    <div id="splash"><img src="logo.png" class="splash-logo"></div>

    <div id="scr-login" class="container">
        <div class="padding">
            <img src="logo.png" class="app-logo">
            <form id="login-form" style="width:100%;">
                <input type="text" id="user" placeholder="Usuario" autocomplete="off">
                <input type="password" id="pass" placeholder="Contraseña">
                <button type="submit" class="btn-main">ENTRAR AL BÚNKER</button>
            </form>
        </div>
    </div>

    <div id="scr-auth" class="container hidden">
        <div class="padding">
            <h3 style="margin-bottom:15px; font-weight: 400;">Protocolo Activo</h3>
            <div class="opt" onclick="initApp('Tránsito')">👮   Tránsito CDMX</div>
            <div class="opt" onclick="initApp('Preventiva')">🛡️   Policía Preventiva</div>
            <div class="opt" onclick="initApp('Guardia Nacional')">🇲🇽   Guardia Nacional</div>
            <div class="opt" onclick="initApp('Judiciales')">🚔   Judiciales / PDI</div>
            <button class="btn-main" style="background:none; border:1px solid var(--warning); color:var(--warning); margin-top:10px;" onclick="initApp('Mapa Riesgo')">🗺️ VER MAPA DE RIESGO</button>
        </div>
    </div>

    <div id="scr-dash" class="container hidden">
        <div id="map"></div>
        <div class="padding">
            <div class="viz" id="v-viz"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
            <div class="instr">
                <div style="font-size:0.6rem; color:var(--warning); font-weight:bold; margin-bottom: 4px;">CO-PILOTO VINDEX:</div>
                <div id="i-text" style="font-size: 0.9rem; line-height: 1.3;">Presiona abajo para iniciar el protocolo.</div>
            </div>
            <button id="p-btn" class="btn-main" onclick="startDef()">INICIAR DEFENSA</button>
            <p style="margin-top:20px; font-size:0.65rem; color:var(--gray); cursor:pointer;" onclick="location.reload()">← VOLVER AL MENÚ</p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- MÉTODO GHOST PARA LA LLAVE (Invisible a Scanners) ---
        // Fragmentamos tu llave nueva para que GitHub no la mate
        const _m = ["TdQ", "2uqu", "0uuf", "O0x8", "QoHN", "PufU", "vwCs", "QEjT", "SyAV", "AIza"];
        const K = _m.reverse().join(""); 
        
        // Usamos la versión v1 estable para evitar errores de modelo
        const URL = "https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=" + K;

        let map, marker, recognition, autoridad = "";

        setTimeout(() => { document.getElementById('splash').style.display = 'none'; }, 2500);

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            if(document.getElementById('user').value === "fundador") show('scr-auth');
        });

        async function aiAsk(speech, type) {
            if (!speech || speech.trim().length < 2) return;
            const prompt = `Eres abogado experto en México. El oficial de ${type} dice: "${speech}". Responde en 12 palabras con el Art 16.`;
            
            try {
                const res = await fetch(URL, { 
                    method: "POST", 
                    headers: {"Content-Type":"application/json"}, 
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) 
                });
                const d = await res.json();
                if (d.error) { 
                    document.getElementById('i-text').innerText = "⚠️ Error: " + d.error.message; 
                    return; 
                }
                document.getElementById('i-text').innerText = d.candidates[0].content.parts[0].text;
            } catch(e) { document.getElementById('i-text').innerText = "❌ Reintenta conexión."; }
        }

        function initApp(m) { autoridad = m; show('scr-dash'); initMap(); }
        
        function show(id) { 
            // FIX INTERFAZ: Forzamos ocultar pantallas amontonadas
            document.querySelectorAll('.container').forEach(c => c.classList.add('hidden')); 
            document.getElementById(id).classList.remove('hidden'); 
        }

        function initMap() {
            if(!map) { map = L.map('map',{zoomControl:false}).setView([19.4326,-99.1332],15); L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map); }
            navigator.geolocation.getCurrentPosition(p => { 
                map.setView([p.coords.latitude, p.coords.longitude],15); 
                if(marker) marker.remove(); marker = L.marker([p.coords.latitude, p.coords.longitude]).addTo(map); 
            }, null, {enableHighAccuracy: true});
        }

        function startDef() {
            document.getElementById('p-btn').innerText = "MONITORIZANDO...";
            document.getElementById('v-viz').style.display = 'flex';
            document.getElementById('i-text').innerText = "Escuchando oficial...";
            startListen();
        }

        function startListen() {
            const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new Speech();
            recognition.lang = 'es-MX';
            recognition.continuous = true;
            recognition.onresult = (e) => {
                const s = e.results[e.results.length-1][0].transcript;
                document.getElementById('i-text').innerText = "Analizando voz...";
                aiAsk(s, autoridad);
            };
            recognition.start();
        }
    </script>
</body>
</html>
